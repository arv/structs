<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threads demo</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --line: #d2d2d7; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --line: #3a3a3c; } }
    body { font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 840px; margin: 2rem auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; margin-top: 2rem; }
    p, td { color: var(--muted); } table { border-collapse: collapse; } td { padding: 2px 16px 2px 0; border-bottom: 1px solid var(--line); }
    button { font: inherit; padding: 4px 14px; }
    canvas { display: block; width: 100%; max-width: 800px; margin-top: 12px; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h1>Threads in plain TypeScript</h1>
  <p id="status">Starting the workers…</p>
  <h2>N-body: shared structs and a barrier</h2>
  <button id="nbody">Run on 1, 2, 4 and 8 threads, twice</button>
  <table><tbody id="nbody-rows"></tbody></table>
  <h2>Mandelbrot: goroutines and channels</h2>
  <button id="mandelbrot">Draw on 1, 2, 4 and 8 threads</button>
  <p id="mandelbrot-times"></p>
  <canvas id="canvas" width="800" height="320"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
