<!doctype html>
<meta charset="utf-8" />
<title>escape-proto: wasm</title>
<style>
  body {
    background: #111;
    color: #ddd;
    font:
      12px/1.2 ui-monospace,
      monospace;
  }
</style>
<pre id="out"></pre>
<script type="module">
  // a Porffor wasm32-wasip1-threads build (wasm.html?wasm=<file under build/>) on the
  // playground's runner, for comparing with the hand-translated JS in the same browser
  import {run} from '/porffor/threads/playground/runner.js';
  const params = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  let text = '';
  const finish = (ok, error) => {
    window.__escapeResult = {ok, error, output: text};
  };
  const bytes = new Uint8Array(
    await (await fetch(`build/${params.get('wasm')}`)).arrayBuffer(),
  );
  const pool = Number(params.get('pool') ?? navigator.hardwareConcurrency ?? 8);
  await run(
    bytes,
    {
      out: (fd, t) => {
        text += t;
        out.textContent = text;
      },
      exit: code => finish(code === 0, code === 0 ? undefined : `exit ${code}`),
      crash: message => finish(false, message),
    },
    pool,
  );
</script>
