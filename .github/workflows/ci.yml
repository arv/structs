# On every push to main and every pull request: vp check (formatting, lint and
# types), vp test (the runtime, the compiler, and workers sharing the heap),
# the examples, compiled and run on node, and the playground in Chrome
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vite+ at the version the catalog names, Node 24, pnpm at the version
      # packageManager names, and vp install, with its cache
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp test
      # four workers count to a million under a Mutex
      - name: examples/counter
        run: |
          out=$(node --import ./src/register.ts examples/counter/main.js)
          echo "$out"
          test "$out" = 'count: 1000000 (expected 1000000)'
      # N-body reaches the reference energy, with direct field access and
      # without
      - name: examples/nbody
        run: |
          for flag in "" --no-fast; do
            node src/compiler/cli.ts compile -p examples/nbody/tsconfig.json $flag
            out=$(node build/nbody/nbody.js 1000000)
            echo "$out"
            echo "$out" | grep -q -- '-0.169086185'
          done

  # the playground's static build in Chrome (the runner's), served as Pages
  # serves it: every program compiled in the browser, on tsgo in WebAssembly
  # (stock TypeScript, built by vp run build-wasm), and run, against the dev
  # server
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the Go TypeScript's go.mod asks for (a newer one, it downloads)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true
      - run: vp run build-wasm
        working-directory: playground
      - run: vp run test-build
        working-directory: playground
